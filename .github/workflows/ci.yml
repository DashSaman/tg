name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race -count=1 -timeout 90s ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tools/wgsoak -p 'test_*.py' -v
      - name: Build Linux targets
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/tg-linux-amd64 ./cmd/tg
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/tg-linux-arm64 ./cmd/tg
